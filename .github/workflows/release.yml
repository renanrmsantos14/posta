# Gera instaladores de Windows e Linux para cada tag v* e publica no Releases,
# com o latest.json assinado que o app usa para se atualizar sozinho.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependências do Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev librsvg2-dev libdbus-1-dev libayatana-appindicator3-dev patchelf

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          POSTA_GOOGLE_CLIENT_ID: ${{ secrets.POSTA_GOOGLE_CLIENT_ID }}
          POSTA_GOOGLE_CLIENT_SECRET: ${{ secrets.POSTA_GOOGLE_CLIENT_SECRET }}
          POSTA_MS_CLIENT_ID: ${{ secrets.POSTA_MS_CLIENT_ID }}
        with:
          projectPath: apps/client
          tagName: ${{ github.ref_name }}
          releaseName: Posta ${{ github.ref_name }}
          releaseBody: |
            Baixe o instalador do seu sistema em **Assets**:
            - **Windows**: `Posta_*_x64-setup.exe`
            - **Linux**: `Posta_*_amd64.AppImage` (ou `.deb` no Ubuntu/Debian)

            No Windows, o SmartScreen pode avisar na primeira instalação: clique em *Mais informações* → *Executar assim mesmo*. Quem já tem o Posta instalado recebe esta versão pelo próprio app.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
