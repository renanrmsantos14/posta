[package]
name = "mail-core"
version = "0.0.0"
edition = "2021"

[dependencies]
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["rustls-tls"] }
mail-parser = "1.0.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
