[package]
name = "posta"
version = "0.0.0"
edition = "2021"

[lib]
name = "posta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mail-core = { path = "../../../crates/mail-core" }
tauri-plugin-process = "2.4.0"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.14.1"
# Arrastar mensagens e anexos para fora da janela (arrasto nativo do sistema, arquivos reais).
tauri-plugin-drag = "2"
tauri-plugin-autostart = "2"
# Bandeja do sistema (ícone, menu e contagem de não lidas).
tauri = { version = "2.12", features = ["tray-icon"] }

# Segredos: cofre do sistema no desktop; Android Keystore (via SharedPreferences cifrado) no Android.
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = "4.2"
open = "5"

[target.'cfg(target_os = "android")'.dependencies]
keyring-core = "1"
android-native-keyring-store = "1"
# Sincronização com o app fechado: o Worker do Android chama o Rust por JNI (ver docs/android.md).
jni = "0.21"
ndk-context = "0.1"
