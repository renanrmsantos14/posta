[package]
name = "posta"
version = "0.0.0"
edition = "2021"

[lib]
name = "posta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "4.2"
open = "5"
mail-core = { path = "../../../crates/mail-core" }
tauri-plugin-process = "2.4.0"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.14.1"
